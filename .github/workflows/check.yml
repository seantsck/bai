# Runs `npm run check` (lint, typecheck, app/history/database tests, production build, whitespace, credential scan, publication check) on every
# pull request and on main. It is deliberately inert toward every real system:
#   * no secrets and no hosted credentials are referenced, and none are set in the environment: the database tests start their own
#     disposable PostgreSQL 17 (embedded-postgres) inside the job and nothing here can reach the hosted BAI database;
#   * `pull_request` (never `pull_request_target`), read-only token, credentials not persisted;
#   * it does not deploy, publish, import or migrate anything. Production releases stay manual (vercel.json ignoreCommand).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANG: C.UTF-8   # the database tests start PostgreSQL with the process locale; UTF-8 keeps accented names intact
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # The restore tests (tests/db/restore-export.test.mjs) run pg_dump and psql against the embedded PostgreSQL 17 server. The embedded distribution ships no client tools and the
      # runner image carries PostgreSQL 16 clients, which pg_dump refuses to use against a 17 server. Install the PostgreSQL 17 clients (client tools only, no server) from the
      # PostgreSQL project's apt repository, put them first on PATH, and fail the job here if the major version is not 17.
      - name: PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          export PATH=/usr/lib/postgresql/17/bin:$PATH
          command -v pg_dump psql
          pg_dump --version | grep -E ' 17\.'
          psql --version | grep -E ' 17\.'
      # The Data API boundary tests (tests/db/rest-boundary, promotion-rest, promotion-counts) run against a REAL PostgREST. Provision the pinned release (12.2.3, linux static x64): the
      # archive's SHA-256 is checked before it is unpacked, the binary's own SHA-256 is checked after, and BAI_REQUIRE_POSTGREST=1 turns a missing binary into a test failure, not a skip.
      - name: PostgREST 12.2.3 (pinned)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/postgrest" && cd "$RUNNER_TEMP/postgrest"
          curl -fsSL -o postgrest.tar.xz https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          echo "9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c  postgrest.tar.xz" | sha256sum -c -
          tar -xJf postgrest.tar.xz
          echo "870a77f49508479bc87c5504b6b0c3715c7220926932d916b0d73952b297c617  postgrest" | sha256sum -c -
          ./postgrest --version | grep -F 'PostgREST 12.2.3'
          echo "BAI_POSTGREST_BIN=$RUNNER_TEMP/postgrest/postgrest" >> "$GITHUB_ENV"
          echo "BAI_REQUIRE_POSTGREST=1" >> "$GITHUB_ENV"
      - run: npm ci
      # The research tooling refuses an outbound header containing the value of any environment variable whose name suggests a secret (OWNER, KEY, TOKEN, ...).
      # Actions sets GITHUB_REPOSITORY_OWNER (a public value, also in the project URL that identifies BAI), which would trip that guard in a test. The guard is
      # unchanged; the two runner variables are simply not passed to the check.
      - run: env -u GITHUB_REPOSITORY_OWNER -u GITHUB_REPOSITORY_OWNER_ID npm run check
